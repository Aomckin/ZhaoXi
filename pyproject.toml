[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhaoxi"
version = "0.5.1.2"
description = "Zhaoxi personal agent core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
zhaoxi = "zhaoxi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zhaoxi"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = ["asyncio: run an asynchronous test with the standard-library event loop"]
