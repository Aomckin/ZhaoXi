[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zhaoxi"
version = "1.1.5"
description = "Zhaoxi personal agent core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "tzdata>=2025.2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
desktop = [
  "Pillow>=10,<13",
  "pystray>=0.19.5,<1",
  "pywebview>=6.2.1,<7",
  "windows-toasts>=1.3.1,<2",
]
voice = [
  "comtypes>=1.4.16,<2",
  "sounddevice>=0.5.6,<1",
]

[project.scripts]
zhaoxi = "zhaoxi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zhaoxi = ["personality/*.yaml", "web/static/*.html", "web/static/*.png", "web/static/*.ico"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = ["asyncio: run an asynchronous test with the standard-library event loop"]
