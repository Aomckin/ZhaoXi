<!doctype html>
<html lang="zh-CN" data-theme="autumn-wheat">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>朝汐 · 秋日麦田</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    #toolControls *{animation:none!important}#toolControls{overflow-wrap:anywhere}#toolControls button{margin:3px 3px 3px 0}#toolControls label{display:inline-block;margin:4px 0}
    :root{color-scheme:light;--bg:#eef5ff;--panel:#fff;--ink:#17233c;--muted:#71809b;--line:#dbe7f7;--blue:#3977e8;--blue2:#6ca6ff;--soft:#edf5ff;--danger:#c54d5c;--shadow:0 18px 60px rgba(49,87,146,.14)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 10% 5%,#fff 0,#f2f7ff 34%,#eaf2ff 100%);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}
    .shell{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 310px;max-width:1320px;margin:auto;padding:24px;gap:18px}
    .chat,.side{background:rgba(255,255,255,.9);border:1px solid rgba(210,225,247,.9);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
    .chat{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.top{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .identity{display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff;font-size:20px}.name-line{display:flex;align-items:center;gap:8px}.name{font-weight:750;font-size:18px}.interaction-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:750;line-height:1.5}.interaction-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.interaction-badge.active{color:#147a50;background:#e5f8ef}.interaction-badge.semi-active{color:#8a6414;background:#fff5d9}.interaction-badge[hidden]{display:none}.sub{font-size:12px;color:var(--muted)}
    button{font:inherit;border:0;cursor:pointer}.ghost{background:var(--soft);color:var(--blue);padding:8px 13px;border-radius:12px}.messages{padding:28px;overflow-y:auto;scroll-behavior:smooth}.empty{text-align:center;color:var(--muted);margin-top:18vh}.empty b{display:block;color:var(--ink);font-size:22px;margin-bottom:8px}
    .row{display:flex;margin:14px 0}.row.user{justify-content:flex-end}.bubble{max-width:min(76%,720px);padding:12px 16px;border-radius:18px;background:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff;border-bottom-right-radius:5px}.assistant .bubble{border-bottom-left-radius:5px}
    .system .bubble{border:1px solid #a8caff;background:#f7fbff}.badge{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.08em;margin-bottom:4px}.permission{max-width:600px;margin:12px 0;padding:16px;border:1px solid #b9d3fb;border-radius:17px;background:#f8fbff}.permission h3{margin:0 0 4px}.permission p{margin:3px 0;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:12px}.allow,.send{background:var(--blue);color:#fff}.deny{background:#fff0f1;color:var(--danger)}.allow,.deny{padding:8px 16px;border-radius:11px}
    .composer{padding:16px 20px 20px;border-top:1px solid var(--line)}.activity{height:24px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inputbox{display:flex;align-items:flex-end;gap:10px;background:#f7faff;border:1px solid var(--line);border-radius:18px;padding:10px}textarea{width:100%;resize:none;border:0;outline:0;background:transparent;min-height:28px;max-height:150px;font:inherit;color:var(--ink)}.send,.mic{flex:0 0 34px;width:34px;height:34px;border-radius:11px;font-size:16px;padding:0}.send{background:var(--blue);color:#fff}.mic{display:none;background:#eaf2ff;color:var(--blue)}.mic.recording{background:#fff0f1;color:var(--danger)}.send:disabled,.mic:disabled{opacity:.45;cursor:not-allowed}.voice-review{display:none;margin-bottom:10px;padding:12px;border:1px solid #b9d3fb;border-radius:14px;background:#f8fbff}.voice-review textarea{min-height:58px}.voice-review .actions button{padding:7px 12px;border-radius:10px}.speak{display:block;margin-top:8px;background:transparent;color:var(--blue);font-size:12px;padding:0}
    .action-trace{margin:18px 0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fffdf6b8;font-size:13px}.action-trace summary{cursor:pointer;font-weight:650}.action-trace ol{margin:10px 0 0;padding-left:20px;max-height:320px;overflow:auto}.action-trace ol:empty{display:none}.action-trace li{padding:4px 0;color:var(--muted);overflow-wrap:anywhere}.action-trace li.running,.action-trace li.retrying{color:var(--blue)}.action-trace li.success{color:#168052}.action-trace li.warning{color:#9a6a16}.action-trace li.failed{color:var(--danger)}.action-trace .trace-debug{margin-top:10px}.trace-model-call{margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px}.trace-model-call p{margin:4px 0}.trace-model-call details{margin-top:6px}.action-trace pre{max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.45 ui-monospace,monospace}
    .side{padding:20px;overflow-y:auto}.side h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 14px}.status{display:flex;align-items:center;gap:8px;margin-bottom:22px}.dot{width:9px;height:9px;border-radius:50%;background:#35b878;box-shadow:0 0 0 5px #e5f8ef}.notice{padding:12px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fbfdff}.notice small{color:var(--muted)}details{border-top:1px solid var(--line);margin-top:22px;padding-top:16px}summary{cursor:pointer;font-weight:700}.debug{font:12px/1.5 ui-monospace,monospace;color:#526078;white-space:pre-wrap;margin-top:10px}
    @media(max-width:820px){.shell{grid-template-columns:1fr;padding:0;height:100dvh}.chat{border-radius:0}.side{display:none}.messages{padding:18px}.bubble{max-width:88%}}
    #attachImage{flex:0 0 34px;width:34px;height:34px;padding:7px;border-radius:11px;display:grid;place-items:center}#attachImage svg{width:18px;height:18px}.message-time{display:block;margin-top:6px;font-size:11px;opacity:.7}
    .image-preview{display:flex;gap:8px;flex-wrap:wrap;max-height:150px;overflow:auto}
    .image-preview:empty{display:none}.image-preview figure{margin:4px 0;position:relative}
    .image-preview img{width:80px;height:80px;object-fit:cover;border-radius:10px}
    .image-preview button{position:absolute;right:0;top:0;border-radius:50%;background:white;color:var(--danger)}
    .bubble img.attachment{display:block;max-width:100%;max-height:360px;object-fit:contain;border-radius:10px;margin-top:8px}
    .image-only{max-width:min(72%,520px);display:flex;flex-wrap:wrap;gap:8px;position:relative;padding-bottom:20px}
    .image-only img.attachment{display:block;max-width:100%;max-height:360px;object-fit:contain;border-radius:12px;cursor:zoom-in}
    .image-only .message-time{position:absolute;right:0;bottom:0}
    .row.user .image-only{margin-left:auto}.row.assistant .image-only{margin-right:auto}
    .emoji-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.emoji-toolbar input{min-width:0;flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--cream-soft)}
    .emoji-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.emoji-card{border:1px solid var(--line);border-radius:13px;padding:7px;background:var(--cream-soft);min-width:0;text-align:left}.emoji-card img{width:100%;height:92px;object-fit:contain;border-radius:9px}.emoji-card small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.emoji-card.disabled{opacity:.55}.emoji-count{color:var(--muted);font-size:12px}
    #emojiEditor{max-width:520px;width:calc(100% - 28px);border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--cream)}#emojiEditor::backdrop{background:#17231c66}#emojiEditor img{display:block;max-width:100%;max-height:280px;margin:auto;border-radius:12px}#emojiEditor label{display:block;margin:10px 0}#emojiEditor input[type=text],#emojiEditor textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--line);border-radius:9px;background:white}#emojiEditor textarea{min-height:88px}
    .message-group{position:relative}.regenerate{display:block;margin:2px 0 0 8px;padding:2px 5px;background:transparent;color:var(--muted);font-size:16px;line-height:1;border-radius:7px;opacity:.7}.regenerate[hidden]{display:none}.regenerate:hover,.regenerate:focus-visible{color:var(--blue);background:var(--soft);opacity:1}.regenerate:disabled{cursor:wait;opacity:.35}
      .recall{background:transparent;color:inherit;font-size:12px;padding:2px 0;margin-left:10px;opacity:.75;text-decoration:underline}
.quick-debug{padding:12px;border:1px solid var(--line);border-radius:16px;margin-bottom:18px}.quick-debug>summary{font-weight:700;cursor:pointer}.quick-debug label{display:flex;align-items:center;gap:8px}.quick-debug input[type="checkbox"]{flex-shrink:0}.quick-debug button{margin:3px 4px 3px 0;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}.quick-debug button[aria-pressed="true"]{background:var(--blue);color:#fff}.quick-debug button:disabled{opacity:.5;cursor:wait}.quick-debug [role="status"]{display:block;margin-top:8px}
</style>
  <link rel="stylesheet" href="/static/themes.css">
  <link rel="stylesheet" href="/static/scene.css">
  <link rel="stylesheet" href="/static/desktop.css">
</head>
<body>
<div class="scene-background" aria-hidden="true"></div><div class="scene-ambient" aria-hidden="true"></div>
<main class="shell">
    <header class="top character-anchor" data-state="unknown"><div class="identity"><div class="character-portrait"><span id="avatarFallback" role="img" aria-label="朝汐">汐</span><img id="characterAvatar" alt="朝汐，戴向日葵发卡的金发犬耳少女" width="512" height="512" hidden></div><div><div class="name-line"><div class="name">朝汐</div><span id="interactionBadge" class="interaction-badge" role="status" aria-live="polite" hidden></span></div><div class="sub">潮庭女仆长 · 我在这里</div><span id="connection" role="status" aria-live="polite" class="sub">正在连接 Core…</span><div id="presenceActivity" class="sub" role="status" aria-live="polite" hidden></div></div></div></header>
  <section class="chat">

    <div id="messages" class="messages"><div id="empty" class="empty"><b>晚上好，暗苟酱。</b>我在这里。想聊点什么，还是看看今天？</div></div>
    <footer class="composer"><div id="activity" class="activity" role="status" aria-live="polite"></div><div id="voiceReview" class="voice-review"><textarea id="voiceText" aria-label="语音识别结果"></textarea><div class="actions"><button id="voiceConfirm" class="allow">发送</button><button id="voiceRetry" class="ghost">重新录音</button><button id="voiceCancel" class="deny">取消</button></div></div><div id="imagePreview" class="image-preview" aria-label="待发送图片"></div><input id="imageFiles" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><div class="inputbox"><button id="attachImage" class="ghost" aria-label="添加图片" title="添加图片（最多20张，每张100MB）"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg></button><textarea id="input" rows="1" aria-label="发送给朝汐的消息" placeholder="和朝汐说点什么……"></textarea><button id="mic" class="mic" aria-label="开始录音">●</button><button id="send" class="send" aria-label="发送">↑</button></div></footer>
  </section>

</main>
<button id="sideToggle" class="desk-handle" type="button" aria-controls="desk" aria-expanded="false" aria-label="打开小桌边"><span id="deskUnread" class="note-unread" hidden aria-hidden="true"></span><span>小桌边</span><span aria-hidden="true">‹</span></button>
<aside id="desk" class="side deskboard" aria-labelledby="deskTitle" aria-hidden="true" inert>
  <header class="desk-heading"><button id="deskClose" type="button" class="ghost" aria-label="收起小桌边">‹</button><div><h2 id="deskTitle">朝汐的小桌边</h2><p class="desk-caption">风经过麦田，我在你身边。</p></div></header>
  <div class="desk-content">
    <details id="quickDebugPanel" class="quick-debug" open><summary>常用调试</summary><p><label><input id="regenerateDebugToggle" type="checkbox" disabled> 显示普通回复的重新生成按钮</label></p><p><label><input id="longWaitToggle" type="checkbox" disabled> 长时等待（请求上限 2 分钟）</label></p><p><label><input id="forceFastChatToggle" type="checkbox" disabled> 强制使用 FAST_CHAT（仅 Desktop/Web 与 Owner 私聊）</label></p><p><label><input id="forceNonFastChatToggle" type="checkbox" disabled> 强制使用非 FAST_CHAT（标准通道）</label></p><p><label><input id="allowMultiModelCallsToggle" type="checkbox" disabled> 允许多轮模型调用（仍受总步数和预算限制）</label></p><p><button class="forcePresence" data-state="ACTIVE" type="button" aria-pressed="false">强制活跃</button> <button class="forcePresence" data-state="SEMI_ACTIVE" type="button" aria-pressed="false">强制半活跃</button> <button class="forcePresence" data-state="AWAY" type="button" aria-pressed="false">强制离开</button> <button class="forcePresence" data-state="IDLE" type="button" aria-pressed="false">强制空闲</button> <button class="forcePresence" data-state="SLEEP" type="button" aria-pressed="false">强制睡眠</button> <span id="presenceDebugStatus" role="status" class="sub">再次点击已选状态可恢复自动判断</span></p><button id="poke" type="button">戳一戳</button> <button id="restartCore" type="button">重启 Core</button><span id="pokeStatus" role="status"></span></details>
    <div id="actionTrace" class="action-trace"><strong id="actionTraceSummary">行动记录</strong><p id="actionMaintenance" class="sub"></p><p id="actionPlannerStatus" class="sub">Planner：等待本轮请求</p><p id="actionTokenSummary" aria-live="polite"></p><div id="actionModelCalls"></div><pre id="actionRuntimeSummary" aria-live="polite"></pre><ol id="actionTraceEvents" aria-live="polite"></ol><details class="trace-debug"><summary>技术详情</summary><pre id="actionTraceDebug"></pre></details></div>
    <section aria-labelledby="notesTitle"><h3 id="notesTitle">朝汐留下的话</h3><div id="proactiveNotes" aria-live="polite"><div class="desk-note"><p>想说的话，慢慢说就好。</p><small>她留下的小纸条，就收在这里。</small></div></div><p id="noteReadStatus" role="status" class="sub"></p></section>
    <section class="recent-board agenda-board" aria-labelledby="agendaTitle"><h3 id="agendaTitle">日程表</h3><div id="agendaTimeline" aria-live="polite"><p class="desk-empty">正在翻看日程…</p></div></section>
    <section class="recent-board memory-board" aria-labelledby="currentCognitionTitle"><h3 id="currentCognitionTitle">近期状态</h3><div id="currentCognition" aria-live="polite"><div class="memory-paper"><p>正在整理近期状态…</p></div></div></section>
    <p><a class="dashboard-entry" href="/dashboard" target="_blank" rel="noopener">打开管理面板 ↗</a></p>
  </div>
</aside>

<script id="characterConfig" type="application/json">{"avatar":"/static/avatar-default.webp","avatars":{"ACTIVE":"/static/avatar-default.webp","SEMI_ACTIVE":"/static/avatar-daydream.png","IDLE":"/static/avatar-nap.png","AWAY":"/static/avatar-nap.png"}}</script>
<script src="/static/deskboard.js"></script>
<script src="/static/reply-renderer.js"></script>
<link rel="stylesheet" href="/static/message-tools.css">
<script src="/static/message-tools.js"></script>
<script src="/static/shell.js"></script>
<script src="/static/desktop.js"></script>
<script src="/static/tool-control.js"></script>
<script src="/static/emoji-cabinet.js"></script>
</body>
</html>
