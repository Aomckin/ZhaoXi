<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>朝汐 · Local Shell</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root{color-scheme:light;--bg:#eef5ff;--panel:#fff;--ink:#17233c;--muted:#71809b;--line:#dbe7f7;--blue:#3977e8;--blue2:#6ca6ff;--soft:#edf5ff;--danger:#c54d5c;--shadow:0 18px 60px rgba(49,87,146,.14)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 10% 5%,#fff 0,#f2f7ff 34%,#eaf2ff 100%);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}
    .shell{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 310px;max-width:1320px;margin:auto;padding:24px;gap:18px}
    .chat,.side{background:rgba(255,255,255,.9);border:1px solid rgba(210,225,247,.9);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
    .chat{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.top{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .identity{display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff;font-size:20px}.name-line{display:flex;align-items:center;gap:8px}.name{font-weight:750;font-size:18px}.interaction-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:750;line-height:1.5}.interaction-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.interaction-badge.active{color:#147a50;background:#e5f8ef}.interaction-badge.semi-active{color:#8a6414;background:#fff5d9}.interaction-badge[hidden]{display:none}.sub{font-size:12px;color:var(--muted)}
    button{font:inherit;border:0;cursor:pointer}.ghost{background:var(--soft);color:var(--blue);padding:8px 13px;border-radius:12px}.messages{padding:28px;overflow-y:auto;scroll-behavior:smooth}.empty{text-align:center;color:var(--muted);margin-top:18vh}.empty b{display:block;color:var(--ink);font-size:22px;margin-bottom:8px}
    .row{display:flex;margin:14px 0}.row.user{justify-content:flex-end}.bubble{max-width:min(76%,720px);padding:12px 16px;border-radius:18px;background:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff;border-bottom-right-radius:5px}.assistant .bubble{border-bottom-left-radius:5px}
    .system .bubble{border:1px solid #a8caff;background:#f7fbff}.badge{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.08em;margin-bottom:4px}.permission{max-width:600px;margin:12px 0;padding:16px;border:1px solid #b9d3fb;border-radius:17px;background:#f8fbff}.permission h3{margin:0 0 4px}.permission p{margin:3px 0;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:12px}.allow,.send{background:var(--blue);color:#fff}.deny{background:#fff0f1;color:var(--danger)}.allow,.deny{padding:8px 16px;border-radius:11px}
    .composer{padding:16px 20px 20px;border-top:1px solid var(--line)}.activity{height:24px;color:var(--muted);font-size:13px}.inputbox{display:flex;align-items:flex-end;gap:10px;background:#f7faff;border:1px solid var(--line);border-radius:18px;padding:10px}textarea{width:100%;resize:none;border:0;outline:0;background:transparent;min-height:28px;max-height:150px;font:inherit;color:var(--ink)}.send,.mic{flex:0 0 34px;width:34px;height:34px;border-radius:11px;font-size:16px;padding:0}.send{background:var(--blue);color:#fff}.mic{display:none;background:#eaf2ff;color:var(--blue)}.mic.recording{background:#fff0f1;color:var(--danger)}.send:disabled,.mic:disabled{opacity:.45;cursor:not-allowed}.voice-review{display:none;margin-bottom:10px;padding:12px;border:1px solid #b9d3fb;border-radius:14px;background:#f8fbff}.voice-review textarea{min-height:58px}.voice-review .actions button{padding:7px 12px;border-radius:10px}.speak{display:block;margin-top:8px;background:transparent;color:var(--blue);font-size:12px;padding:0}
    .side{padding:20px;overflow-y:auto}.side h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 14px}.status{display:flex;align-items:center;gap:8px;margin-bottom:22px}.dot{width:9px;height:9px;border-radius:50%;background:#35b878;box-shadow:0 0 0 5px #e5f8ef}.notice{padding:12px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fbfdff}.notice small{color:var(--muted)}details{border-top:1px solid var(--line);margin-top:22px;padding-top:16px}summary{cursor:pointer;font-weight:700}.debug{font:12px/1.5 ui-monospace,monospace;color:#526078;white-space:pre-wrap;margin-top:10px}
    @media(max-width:820px){.shell{grid-template-columns:1fr;padding:0;height:100dvh}.chat{border-radius:0}.side{display:none}.messages{padding:18px}.bubble{max-width:88%}}
    #attachImage{flex:0 0 34px;width:34px;height:34px;padding:7px;border-radius:11px;display:grid;place-items:center}#attachImage svg{width:18px;height:18px}.message-time{display:block;margin-top:6px;font-size:11px;opacity:.7}
    .image-preview{display:flex;gap:8px;flex-wrap:wrap;max-height:150px;overflow:auto}
    .image-preview:empty{display:none}.image-preview figure{margin:4px 0;position:relative}
    .image-preview img{width:80px;height:80px;object-fit:cover;border-radius:10px}
    .image-preview button{position:absolute;right:0;top:0;border-radius:50%;background:white;color:var(--danger)}
    .bubble img.attachment{display:block;max-width:100%;max-height:360px;object-fit:contain;border-radius:10px;margin-top:8px}
      .recall{background:transparent;color:inherit;font-size:12px;padding:2px 0;margin-left:10px;opacity:.75;text-decoration:underline}
</style>
</head>
<body>
<main class="shell">
  <section class="chat">
    <header class="top"><div class="identity"><div class="avatar">汐</div><div><div class="name-line"><div class="name">朝汐</div><span id="interactionBadge" class="interaction-badge" role="status" aria-live="polite" hidden></span></div><div class="sub">Local Interaction Shell · 127.0.0.1:4913</div></div></div><button id="clear" class="ghost">清空会话</button></header>
    <div id="messages" class="messages"><div id="empty" class="empty"><b>晚上好，暗苟酱。</b>我在这里。想聊点什么，还是看看今天？</div></div>
    <footer class="composer"><div id="activity" class="activity" role="status" aria-live="polite"></div><div id="voiceReview" class="voice-review"><textarea id="voiceText" aria-label="语音识别结果"></textarea><div class="actions"><button id="voiceConfirm" class="allow">发送</button><button id="voiceRetry" class="ghost">重新录音</button><button id="voiceCancel" class="deny">取消</button></div></div><div id="imagePreview" class="image-preview" aria-label="待发送图片"></div><input id="imageFiles" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><div class="inputbox"><button id="attachImage" class="ghost" aria-label="添加图片" title="添加图片（最多20张，每张100MB）"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg></button><textarea id="input" rows="1" aria-label="发送给朝汐的消息" placeholder="和朝汐说点什么…"></textarea><button id="mic" class="mic" aria-label="开始录音">●</button><button id="send" class="send" aria-label="发送">↑</button></div></footer>
  </section>
  <aside class="side"><h2>连接状态</h2><div class="status"><span class="dot" aria-hidden="true"></span><span id="connection" role="status" aria-live="polite">本地 Core 已连接</span></div><details open><summary>可以这样找我</summary><div id="capabilities"><div class="sub">正在准备建议…</div></div></details><details open><summary>系统消息</summary><div id="notices" aria-live="polite"><div class="sub">暂无新的系统消息。</div></div></details><details><summary>设置</summary><p><label><input id="thinkingToggle" type="checkbox" disabled> 模型思考</label> <small id="thinkingStatus">正在读取…</small></p><p><label>输入合并 <output id="mergeValue">15 秒</output><input id="mergeRange" type="range" min="0" max="30" step="1" value="15" style="width:100%"></label></p><p><label>分段回复间隔 <output id="replyValue">5–10 秒</output><input id="replyRange" type="range" min="0" max="15" step="1" value="5" style="width:100%"></label></p></details><details><summary>Debug</summary><button id="poke" type="button">戳一戳</button><span id="pokeStatus" role="status"></span><div id="debug" class="debug">等待首次请求…</div></details></aside>
</main>
<script>
const $=s=>document.querySelector(s), messages=$('#messages'), input=$('#input'), send=$('#send'), mic=$('#mic'), activity=$('#activity'), debug=$('#debug'), voiceReview=$('#voiceReview'), voiceText=$('#voiceText');let busy=false,voiceEnabled=false,voiceRecording=false,speechActive=false;
function escapeHtml(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function markdown(v){return escapeHtml(v).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>')}
// Split presentation only: keep the original reply intact in Core/session history.
function splitReply(content){
  const segments=[], lines=String(content??'').replace(/\r\n?/g,'\n').split('\n');
  let paragraph=[], fence=null;
  const flush=()=>{const text=paragraph.join('\n').trim();if(text)segments.push(text);paragraph=[]};
  for(const line of lines){
    const marker=line.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);
    if(marker){
      if(!fence)fence={char:marker[1][0],length:marker[1].length};
      else if(marker[1][0]===fence.char&&marker[1].length>=fence.length&&!marker[2].trim())fence=null;
      paragraph.push(line);
    }else if(!fence&&!line.trim())flush();
    else paragraph.push(line);
  }
  flush();return segments;
}
function addMessage(role,content,kind='',images=[],timestamp=null){
  const parts=role==='assistant'&&kind!=='system'?splitReply(content):[content];
  return parts.map(part=>addMessageBubble(role,part,kind,images,timestamp));
}
// New replies are paced; session restoration continues to use addMessage directly.
async function sendReply(content,timestamp=null){
  const parts=splitReply(content);
  for(let i=0;i<parts.length;i++){
    if(i>0){
      activity.textContent='朝汐正在继续回复…';
      await new Promise(resolve=>setTimeout(resolve,(typeof replyIntervalMs==='undefined'?5000:replyIntervalMs)+Math.floor(Math.random()*((typeof replyIntervalMs==='undefined'?5000:replyIntervalMs)+1))));
    }
    addMessageBubble('assistant',parts[i],'',[],timestamp);
  }
}
let displayTimezone='Asia/Shanghai';
function formatTime(value){return value?new Intl.DateTimeFormat('zh-CN',{timeZone:displayTimezone,year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value)):''}
function addMessageBubble(role,content,kind='',images=[],timestamp=null){ $('#empty')?.remove();const row=document.createElement('div');row.className=`row ${role} ${kind}`;row.innerHTML=`<div class="bubble">${kind==='system'?'<div class="badge">系统消息</div>':''}${markdown(content)}<time class="message-time">${escapeHtml(formatTime(timestamp||new Date().toISOString()))}</time></div>`;if(role==='assistant'&&kind!=='system'&&voiceEnabled){const b=document.createElement('button');b.className='speak';b.textContent='朗读';b.onclick=()=>speakText(content,b);row.querySelector('.bubble').append(b)}for(const src of images){if(!/^data:image\/(png|jpeg|webp);base64,/.test(src))continue;const image=document.createElement('img');image.className='attachment';image.alt='用户发送的图片';image.src=src;image.onload=()=>{messages.scrollTop=messages.scrollHeight};row.querySelector('.bubble').append(image)}messages.append(row);messages.scrollTop=messages.scrollHeight;return row }
function permissionCard(p){const box=document.createElement('div');box.className='permission';box.innerHTML=`<h3>朝汐想执行</h3><div>${escapeHtml(p.action)}</div><p>权限：${escapeHtml(p.permission.toUpperCase())}</p><p>范围：${escapeHtml(p.resource_scope)}</p><div class="actions"><button class="allow">允许</button><button class="deny">拒绝</button></div>`;messages.append(box);box.querySelector('.allow').onclick=()=>resolve(p.confirmation_id,'approve',box);box.querySelector('.deny').onclick=()=>resolve(p.confirmation_id,'deny',box);messages.scrollTop=messages.scrollHeight}
async function request(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const data=await r.json();if(!r.ok)throw new Error(data.detail||'请求失败');return data}
let INPUT_MERGE_MS=15000;
let pendingInput=[], inputTimer=null;
function recallInput(item){
  const index=pendingInput.indexOf(item);if(index<0)return;
  pendingInput.splice(index,1);item.row.remove();
  if(!pendingInput.length){clearTimeout(inputTimer);inputTimer=null}
  $('#clear').disabled=busy||imagesReading||pendingInput.length>0;
  if(!busy)activity.textContent=pendingInput.length?'等待合并连续消息…':'';
}
let draftImages=[], imagesReading=false;
const MAX_IMAGES=20, MAX_IMAGE_BYTES=100*1024*1024;
function renderImagePreview(){
  const box=$('#imagePreview');box.replaceChildren();
  draftImages.forEach((src,index)=>{
    const figure=document.createElement('figure'),image=document.createElement('img'),remove=document.createElement('button');
    image.src=src;image.alt=`待发送图片 ${index+1}`;remove.textContent='×';remove.setAttribute('aria-label',`移除图片 ${index+1}`);
    remove.onclick=()=>{draftImages.splice(index,1);renderImagePreview()};figure.append(image,remove);box.append(figure);
  });
}
async function selectImages(files){
  if(imagesReading)return;
  const selected=Array.from(files);
  if(draftImages.length+selected.length>MAX_IMAGES){activity.textContent='每次最多20张图片';return}
  if(selected.some(f=>!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>MAX_IMAGE_BYTES)){
    activity.textContent='请选择 PNG、JPEG、WebP 图片，每张不超过100MB';return;
  }
  imagesReading=true;$('#clear').disabled=true;send.disabled=true;$('#attachImage').disabled=true;
  try{
    const loaded=[];
    for(const file of selected)loaded.push(await new Promise((resolve,reject)=>{
      const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('图片读取失败，请重新选择'));reader.readAsDataURL(file);
    }));
    draftImages.push(...loaded);renderImagePreview();
  }catch(e){activity.textContent=e.message}
  finally{imagesReading=false;send.disabled=false;$('#attachImage').disabled=false;$('#clear').disabled=busy||pendingInput.length>0}
}
function submit(){
  const text=input.value.trim();if(imagesReading||(!text&&!draftImages.length))return;
  const queuedImages=pendingInput.reduce((sum,item)=>sum+item.images.length,0);
  if(queuedImages+draftImages.length>MAX_IMAGES){activity.textContent='本次合并消息最多20张图片，请等待发送后再添加';return}
  if(pendingInput.map(item=>item.text).concat(text).join('\n\n').length>20000){activity.textContent='本次合并文字不能超过20000字，请等待发送后再补充';return}
  const images=draftImages;draftImages=[];renderImagePreview();
  input.value='';
  const row=addMessage('user',text,'',images)[0];
  const recall=document.createElement('button');recall.className='recall';recall.textContent='撤回';
  recall.type='button';recall.setAttribute('aria-label','撤回这条待发送消息');
  const item={text,images,row,recall,timestamp:new Date().toISOString()};pendingInput.push(item);
  recall.onclick=()=>recallInput(item);row.querySelector('.bubble').append(recall);
  $('#clear').disabled=true;
  clearTimeout(inputTimer);
  inputTimer=setTimeout(()=>{inputTimer=null;flushInput()},INPUT_MERGE_MS);
  if(!busy)activity.textContent='等待合并连续消息…';
  input.focus();
}
function finishTurn(){
  busy=false;send.disabled=imagesReading;
  $('#clear').disabled=imagesReading||pendingInput.length>0;
  activity.textContent=pendingInput.length?'等待处理连续消息…':'';
  if(pendingInput.length&&inputTimer===null)void flushInput();
  else if(!pendingInput.length)void drainDeliveries();
}
async function flushInput(){
  if(busy||!pendingInput.length||inputTimer!==null)return;
  const text=pendingInput.map(item=>item.text).filter(Boolean).join('\n\n');
  const images=pendingInput.flatMap(item=>item.images);
  const display_parts=pendingInput.map(item=>({text:item.text,image_count:item.images.length,timestamp:item.timestamp}));
  pendingInput.forEach(item=>item.recall.remove());pendingInput=[];
  busy=true;$('#clear').disabled=true;activity.textContent='正在思考…';
  try{
    const data=await request('/api/chat',{method:'POST',body:JSON.stringify({message:text,images,display_parts})});
    await sendReply(data.content,data.timestamp);
    if(data.permission)permissionCard(data.permission);
    debug.textContent=JSON.stringify(data.activity,null,2);void setupCapabilities();void setupDiagnostics();
  }catch(e){addMessage('assistant',e.message)}
  finally{finishTurn();input.focus()}
}
async function resolve(id,action,box){if(busy)return;busy=true;$('#clear').disabled=true;box.querySelectorAll('button').forEach(b=>b.disabled=true);activity.textContent=action==='approve'?'正在执行已允许的操作…':'正在处理拒绝…';try{const data=await request(`/api/permission/${id}/${action}`,{method:'POST'});box.remove();await sendReply(data.content,data.timestamp);if(data.permission)permissionCard(data.permission);debug.textContent=JSON.stringify(data.activity,null,2);void setupDiagnostics()}catch(e){addMessage('assistant',e.message)}finally{finishTurn()}}
async function setupVoice(){try{const v=await request('/api/voice/status');voiceEnabled=!!v.enabled;mic.style.display=voiceEnabled?'block':'none'}catch(e){voiceEnabled=false}}
async function toggleVoice(){if(busy)return;mic.disabled=true;try{if(!voiceRecording){await request('/api/voice/record/start',{method:'POST'});voiceRecording=true;mic.classList.add('recording');mic.textContent='■';activity.textContent='正在录音… 点击方块停止'}else{activity.textContent='正在识别…';const data=await request('/api/voice/record/stop',{method:'POST'});voiceRecording=false;mic.classList.remove('recording');mic.textContent='●';voiceText.value=data.text||'';voiceReview.style.display='block';activity.textContent='请检查识别结果'}}catch(e){voiceRecording=false;mic.classList.remove('recording');mic.textContent='●';activity.textContent=e.message}finally{mic.disabled=false}}
async function confirmVoice(){const text=voiceText.value.trim();if(!text||busy)return;busy=true;$('#clear').disabled=true;voiceReview.style.display='none';addMessage('user',text);activity.textContent='正在思考…';try{const data=await request('/api/voice/transcript/confirm',{method:'POST',body:JSON.stringify({text})});await sendReply(data.content,data.timestamp);if(data.permission)permissionCard(data.permission);debug.textContent=JSON.stringify(data.activity,null,2);void setupDiagnostics()}catch(e){addMessage('assistant',e.message)}finally{finishTurn();input.focus()}}
async function cancelVoice(){await request('/api/voice/cancel',{method:'POST'});voiceRecording=false;mic.classList.remove('recording');mic.textContent='●';voiceReview.style.display='none';voiceText.value='';activity.textContent=''}
async function speakText(text,button){try{if(speechActive){await request('/api/voice/speak/stop',{method:'POST'});speechActive=false;button.textContent='朗读'}else{await request('/api/voice/speak',{method:'POST',body:JSON.stringify({text})});speechActive=true;button.textContent='停止朗读'}}catch(e){activity.textContent=e.message}}
$('#attachImage').onclick=()=>$('#imageFiles').click();
$('#imageFiles').onchange=async e=>{await selectImages(e.target.files);e.target.value=''};
input.addEventListener('paste',e=>{const files=Array.from(e.clipboardData?.files||[]);if(files.length){e.preventDefault();void selectImages(files)}});
send.onclick=submit;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit()}};input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'};
mic.onclick=toggleVoice;$('#voiceConfirm').onclick=confirmVoice;$('#voiceCancel').onclick=cancelVoice;$('#voiceRetry').onclick=async()=>{await cancelVoice();await toggleVoice()};
$('#clear').onclick=async()=>{if(busy||imagesReading||pendingInput.length)return;await request('/api/session',{method:'DELETE'});draftImages=[];renderImagePreview();messages.innerHTML='<div id="empty" class="empty"><b>会话已清空。</b>重新开始吧。</div>';debug.textContent='Session cleared'};
const seenDeliveries=new Set(), deliveryQueue=[];let historyReady=false;
async function restore(){try{const data=await request('/api/session');data.messages.forEach(m=>{if(m.delivery_id)seenDeliveries.add(m.delivery_id);if(m.kind==='system')return;if(m.role==='user'&&m.display_parts?.length){let offset=0;for(const p of m.display_parts){addMessage('user',p.text,'',(m.images||[]).slice(offset,offset+p.image_count),p.timestamp);offset+=p.image_count}}else addMessage(m.role,m.content,m.kind==='system'?'system':'',m.images||[],m.timestamp)});const p=await request('/api/proactive');p.deliveries.filter(d=>['delivered','acknowledged'].includes(d.status)).reverse().forEach(d=>showNotice(d))}catch(e){$('#connection').textContent='Core 暂时不可用'}finally{historyReady=true;void drainDeliveries()}}
function interactionBadgeView(state){
  if(state==='ACTIVE')return {label:'活跃',className:'active',title:'当前对话仍在持续'};
  if(state==='SEMI_ACTIVE')return {label:'半活跃',className:'semi-active',title:'朝汐醒着，在附近'};
  return null;
}
function renderInteractionBadge(presence){
  const badge=$('#interactionBadge'),view=interactionBadgeView(presence?.interaction_state);
  if(!view){badge.hidden=true;badge.className='interaction-badge';badge.textContent='';badge.removeAttribute('title');badge.removeAttribute('aria-label');return}
  badge.hidden=false;badge.className=`interaction-badge ${view.className}`;badge.textContent=view.label;badge.title=view.title;badge.setAttribute('aria-label',`当前互动状态：${view.label}`);
}
let setupNoticeShown=false;
async function setupDiagnostics(){try{const data=await request('/api/diagnostics');debug.textContent=JSON.stringify(data,null,2);renderInteractionBadge(data.presence);if(data.startup&&data.startup.status!=='ready'){const model=data.startup.checks?.model||{};$('#connection').textContent='需要完成首次配置';input.placeholder='完成配置后即可和朝汐对话';if(!setupNoticeShown){addMessage('assistant',`朝汐尚未完成启动配置。${model.action||'请运行 python main.py --doctor 查看具体问题。'}`);setupNoticeShown=true}}}catch(e){renderInteractionBadge(null);$('#connection').textContent='启动诊断不可用'}}
async function setupCapabilities(){try{const data=await request('/api/suggestions');displayTimezone=data.timezone||displayTimezone;const box=$('#capabilities');box.innerHTML='';(data.suggestions||[]).slice(0,4).forEach(example=>{const item=document.createElement('button');item.type='button';item.className='notice';item.style.width='100%';item.style.textAlign='left';item.textContent=example;item.onclick=()=>{input.value=example;input.focus()};box.append(item)});if(!box.children.length)box.innerHTML='<div class="sub">当前没有可展示的能力。</div>'}catch(e){$('#capabilities').innerHTML='<div class="sub">建议暂时不可用。</div>'}}
let pendingDeliveryTimer=null;
async function openDelivery(id){clearTimeout(pendingDeliveryTimer);if(busy||pendingInput.length){activity.textContent='当前回复结束后打开系统消息…';pendingDeliveryTimer=setTimeout(()=>openDelivery(id),500);return}try{await request('/api/proactive/'+encodeURIComponent(id)+'/activate',{method:'POST'});const data=await request('/api/session');messages.replaceChildren();data.messages.forEach(m=>{if(m.delivery_id)seenDeliveries.add(m.delivery_id);if(m.kind==='system')return;if(m.role==='user'&&m.display_parts?.length){let offset=0;for(const p of m.display_parts){addMessage('user',p.text,'',(m.images||[]).slice(offset,offset+p.image_count),p.timestamp);offset+=p.image_count}}else addMessage(m.role,m.content,m.kind==='system'?'system':'',m.images||[],m.timestamp)});debug.textContent=JSON.stringify(await request('/api/proactive/'+encodeURIComponent(id)+'/inspect'),null,2);const n=document.getElementById('notice-'+id);if(n)n.querySelector('.badge').textContent='已读';void setupCapabilities();input.focus()}catch(e){activity.textContent='暂时无法打开系统消息，请稍后重试'}}
function showNotice(d){if(d.kind!=='system'&&!String(d.event_type||'').startsWith('system.'))return;if(!['delivered','acknowledged'].includes(d.status)||document.getElementById('notice-'+d.delivery_id))return;const n=document.createElement('button');n.id='notice-'+d.delivery_id;n.className='notice';n.style.cssText='display:block;width:100%;text-align:left';n.innerHTML=`<div class="badge">${d.status==='acknowledged'?'已读':'未读'}</div><div>${markdown(d.content)}</div><small>${escapeHtml(formatTime(d.delivered_at||d.available_at))}</small>`;n.onclick=()=>openDelivery(d.delivery_id);$('#notices').querySelector('.sub')?.remove();$('#notices').prepend(n);while($('#notices').children.length>100)$('#notices').lastElementChild.remove()}
function receiveDelivery(d){
  if(d.kind==='system'||String(d.event_type||'').startsWith('system.')){showNotice(d);return}
  if(!['delivered','acknowledged'].includes(d.status)||seenDeliveries.has(d.delivery_id)||deliveryQueue.some(x=>x.delivery_id===d.delivery_id))return;
  deliveryQueue.push(d);void drainDeliveries();
}
async function drainDeliveries(){
  if(!historyReady||busy||pendingInput.length)return;
  while(deliveryQueue.length){
    const d=deliveryQueue.shift();if(seenDeliveries.has(d.delivery_id))continue;
    busy=true;$('#clear').disabled=true;seenDeliveries.add(d.delivery_id);
    try{await sendReply(d.content,d.delivered_at||d.available_at)}finally{finishTurn()}
    if(busy||pendingInput.length)return;
  }
}
let replyIntervalMs=5000;
function applySettings(event){
  INPUT_MERGE_MS=Number($('#mergeRange').value)*1000;
  replyIntervalMs=Number($('#replyRange').value)*1000;
  $('#mergeValue').textContent=INPUT_MERGE_MS?`${INPUT_MERGE_MS/1000} 秒`:'关闭';
  $('#replyValue').textContent=replyIntervalMs?`${replyIntervalMs/1000}–${replyIntervalMs/500} 秒`:'立即';
  try{localStorage.setItem('zhaoxiTiming',JSON.stringify([INPUT_MERGE_MS/1000,replyIntervalMs/1000]))}catch{}
  if(event?.target===$('#mergeRange')&&inputTimer!==null){clearTimeout(inputTimer);inputTimer=setTimeout(()=>{inputTimer=null;flushInput()},INPUT_MERGE_MS)}
}
try{const saved=JSON.parse(localStorage.getItem('zhaoxiTiming'));if(Array.isArray(saved)&&saved.length===2&&saved.every(Number.isFinite)){ $('#mergeRange').value=Math.max(0,Math.min(30,saved[0]));$('#replyRange').value=Math.max(0,Math.min(15,saved[1]))}}catch{}
$('#mergeRange').oninput=applySettings;$('#replyRange').oninput=applySettings;applySettings();
$('#poke').onclick=async()=>{if(busy||pendingInput.length){$('#pokeStatus').textContent='请等当前消息处理完成';return}$('#poke').disabled=true;try{const r=await request('/api/proactive/active/poke',{method:'POST'});$('#pokeStatus').textContent=r.delivered?'已投递':r.trace?.model_diagnostics?.provider_error_code||r.trace?.model_error||r.trace?.gate_reason||'本次选择沉默';void setupDiagnostics()}catch(e){$('#pokeStatus').textContent=e.message}finally{$('#poke').disabled=false}};
async function setupThinking(){try{const s=await request('/api/settings/thinking');$('#thinkingToggle').disabled=!s.supported;$('#thinkingToggle').checked=s.enabled===true;$('#thinkingStatus').textContent=!s.supported?'当前接口不支持':s.enabled===null?'当前由模型默认决定':s.enabled?'已开启':'已关闭'}catch{$('#thinkingStatus').textContent='读取失败'}}
$('#thinkingToggle').onchange=async()=>{const toggle=$('#thinkingToggle');toggle.disabled=true;try{await request('/api/settings/thinking',{method:'PUT',body:JSON.stringify({enabled:toggle.checked})});await setupThinking()}catch(e){toggle.checked=!toggle.checked;$('#thinkingStatus').textContent=e.message;toggle.disabled=false}};
async function start(){const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';if(token){const boot=await fetch('/api/bootstrap',{method:'POST',headers:{'X-Zhaoxi-Token':token}});history.replaceState(null,'',location.pathname+location.search);if(!boot.ok)throw new Error('Desktop 会话初始化失败')}const es=new EventSource('/api/events');es.onmessage=e=>{const data=JSON.parse(e.data);if(data.type==='activity')activity.textContent=data.label||'';if(data.type==='proactive'){receiveDelivery(data.delivery);void setupCapabilities()}};es.onerror=()=>{$('#connection').textContent='事件通道正在重连…'};es.onopen=()=>{$('#connection').textContent='本地 Core 已连接'};await setupThinking();await setupVoice();await setupCapabilities();await restore();await setupDiagnostics();setInterval(setupCapabilities,60000);setInterval(setupDiagnostics,30000);input.focus()};start().catch(()=>{$('#connection').textContent='Desktop 会话初始化失败'});
</script>
