<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>朝汐 · Local Shell</title>
  <style>
    :root{color-scheme:light;--bg:#eef5ff;--panel:#fff;--ink:#17233c;--muted:#71809b;--line:#dbe7f7;--blue:#3977e8;--blue2:#6ca6ff;--soft:#edf5ff;--danger:#c54d5c;--shadow:0 18px 60px rgba(49,87,146,.14)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 10% 5%,#fff 0,#f2f7ff 34%,#eaf2ff 100%);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}
    .shell{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 310px;max-width:1320px;margin:auto;padding:24px;gap:18px}
    .chat,.side{background:rgba(255,255,255,.9);border:1px solid rgba(210,225,247,.9);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
    .chat{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.top{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .identity{display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff;font-size:20px}.name{font-weight:750;font-size:18px}.sub{font-size:12px;color:var(--muted)}
    button{font:inherit;border:0;cursor:pointer}.ghost{background:var(--soft);color:var(--blue);padding:8px 13px;border-radius:12px}.messages{padding:28px;overflow-y:auto;scroll-behavior:smooth}.empty{text-align:center;color:var(--muted);margin-top:18vh}.empty b{display:block;color:var(--ink);font-size:22px;margin-bottom:8px}
    .row{display:flex;margin:14px 0}.row.user{justify-content:flex-end}.bubble{max-width:min(76%,720px);padding:12px 16px;border-radius:18px;background:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff;border-bottom-right-radius:5px}.assistant .bubble{border-bottom-left-radius:5px}
    .proactive .bubble{border:1px solid #a8caff;background:#f7fbff}.badge{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.08em;margin-bottom:4px}.permission{max-width:600px;margin:12px 0;padding:16px;border:1px solid #b9d3fb;border-radius:17px;background:#f8fbff}.permission h3{margin:0 0 4px}.permission p{margin:3px 0;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:12px}.allow,.send{background:var(--blue);color:#fff}.deny{background:#fff0f1;color:var(--danger)}.allow,.deny{padding:8px 16px;border-radius:11px}
    .composer{padding:16px 20px 20px;border-top:1px solid var(--line)}.activity{height:24px;color:var(--muted);font-size:13px}.inputbox{display:flex;align-items:flex-end;gap:10px;background:#f7faff;border:1px solid var(--line);border-radius:18px;padding:10px}textarea{width:100%;resize:none;border:0;outline:0;background:transparent;min-height:28px;max-height:150px;font:inherit;color:var(--ink)}.send,.mic{width:42px;height:42px;border-radius:14px;font-size:19px}.send{background:var(--blue);color:#fff}.mic{display:none;background:#eaf2ff;color:var(--blue)}.mic.recording{background:#fff0f1;color:var(--danger)}.send:disabled,.mic:disabled{opacity:.45;cursor:not-allowed}.voice-review{display:none;margin-bottom:10px;padding:12px;border:1px solid #b9d3fb;border-radius:14px;background:#f8fbff}.voice-review textarea{min-height:58px}.voice-review .actions button{padding:7px 12px;border-radius:10px}.speak{display:block;margin-top:8px;background:transparent;color:var(--blue);font-size:12px;padding:0}
    .side{padding:20px;overflow-y:auto}.side h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 14px}.status{display:flex;align-items:center;gap:8px;margin-bottom:22px}.dot{width:9px;height:9px;border-radius:50%;background:#35b878;box-shadow:0 0 0 5px #e5f8ef}.notice{padding:12px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fbfdff}.notice small{color:var(--muted)}details{border-top:1px solid var(--line);margin-top:22px;padding-top:16px}summary{cursor:pointer;font-weight:700}.debug{font:12px/1.5 ui-monospace,monospace;color:#526078;white-space:pre-wrap;margin-top:10px}
    @media(max-width:820px){.shell{grid-template-columns:1fr;padding:0;height:100dvh}.chat{border-radius:0}.side{display:none}.messages{padding:18px}.bubble{max-width:88%}}
  </style>
</head>
<body>
<main class="shell">
  <section class="chat">
    <header class="top"><div class="identity"><div class="avatar">汐</div><div><div class="name">朝汐</div><div class="sub">Local Interaction Shell · 127.0.0.1:4913</div></div></div><button id="clear" class="ghost">清空会话</button></header>
    <div id="messages" class="messages"><div id="empty" class="empty"><b>晚上好，暗苟酱。</b>我在这里。想聊点什么，还是看看今天？</div></div>
    <footer class="composer"><div id="activity" class="activity" role="status" aria-live="polite"></div><div id="voiceReview" class="voice-review"><textarea id="voiceText" aria-label="语音识别结果"></textarea><div class="actions"><button id="voiceConfirm" class="allow">发送</button><button id="voiceRetry" class="ghost">重新录音</button><button id="voiceCancel" class="deny">取消</button></div></div><div class="inputbox"><textarea id="input" rows="1" aria-label="发送给朝汐的消息" placeholder="和朝汐说点什么…"></textarea><button id="mic" class="mic" aria-label="开始录音">●</button><button id="send" class="send" aria-label="发送">↑</button></div></footer>
  </section>
  <aside class="side"><h2>连接状态</h2><div class="status"><span class="dot" aria-hidden="true"></span><span id="connection" role="status" aria-live="polite">本地 Core 已连接</span></div><h2>可以这样找我</h2><div id="capabilities"><div class="sub">正在读取可用能力…</div></div><h2>主动消息</h2><div id="notices" aria-live="polite"><div class="sub">暂无新的主动消息。</div></div><details><summary>Debug</summary><div id="debug" class="debug">等待首次请求…</div></details></aside>
</main>
<script>
const $=s=>document.querySelector(s), messages=$('#messages'), input=$('#input'), send=$('#send'), mic=$('#mic'), activity=$('#activity'), debug=$('#debug'), voiceReview=$('#voiceReview'), voiceText=$('#voiceText');let busy=false,voiceEnabled=false,voiceRecording=false,speechActive=false;
function escapeHtml(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function markdown(v){return escapeHtml(v).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>')}
function addMessage(role,content,kind=''){ $('#empty')?.remove();const row=document.createElement('div');row.className=`row ${role} ${kind}`;row.innerHTML=`<div class="bubble">${kind==='proactive'?'<div class="badge">主动消息</div>':''}${markdown(content)}</div>`;if(role==='assistant'&&kind!=='proactive'&&voiceEnabled){const b=document.createElement('button');b.className='speak';b.textContent='朗读';b.onclick=()=>speakText(content,b);row.querySelector('.bubble').append(b)}messages.append(row);messages.scrollTop=messages.scrollHeight }
function permissionCard(p){const box=document.createElement('div');box.className='permission';box.innerHTML=`<h3>朝汐想执行</h3><div>${escapeHtml(p.action)}</div><p>权限：${escapeHtml(p.permission.toUpperCase())}</p><p>范围：${escapeHtml(p.resource_scope)}</p><div class="actions"><button class="allow">允许</button><button class="deny">拒绝</button></div>`;messages.append(box);box.querySelector('.allow').onclick=()=>resolve(p.confirmation_id,'approve',box);box.querySelector('.deny').onclick=()=>resolve(p.confirmation_id,'deny',box);messages.scrollTop=messages.scrollHeight}
async function request(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const data=await r.json();if(!r.ok)throw new Error(data.detail||'请求失败');return data}
async function submit(){const text=input.value.trim();if(!text||busy)return;busy=true;send.disabled=true;input.value='';addMessage('user',text);activity.textContent='正在思考…';try{const data=await request('/api/chat',{method:'POST',body:JSON.stringify({message:text})});addMessage('assistant',data.content);if(data.permission)permissionCard(data.permission);debug.textContent=JSON.stringify(data.activity,null,2)}catch(e){addMessage('assistant',e.message)}finally{busy=false;send.disabled=false;activity.textContent='';input.focus()}}
async function resolve(id,action,box){box.querySelectorAll('button').forEach(b=>b.disabled=true);activity.textContent=action==='approve'?'正在执行已允许的操作…':'正在处理拒绝…';try{const data=await request(`/api/permission/${id}/${action}`,{method:'POST'});box.remove();addMessage('assistant',data.content);if(data.permission)permissionCard(data.permission);debug.textContent=JSON.stringify(data.activity,null,2)}catch(e){addMessage('assistant',e.message)}finally{activity.textContent=''}}
async function setupVoice(){try{const v=await request('/api/voice/status');voiceEnabled=!!v.enabled;mic.style.display=voiceEnabled?'block':'none'}catch(e){voiceEnabled=false}}
async function toggleVoice(){if(busy)return;mic.disabled=true;try{if(!voiceRecording){await request('/api/voice/record/start',{method:'POST'});voiceRecording=true;mic.classList.add('recording');mic.textContent='■';activity.textContent='正在录音… 点击方块停止'}else{activity.textContent='正在识别…';const data=await request('/api/voice/record/stop',{method:'POST'});voiceRecording=false;mic.classList.remove('recording');mic.textContent='●';voiceText.value=data.text||'';voiceReview.style.display='block';activity.textContent='请检查识别结果'}}catch(e){voiceRecording=false;mic.classList.remove('recording');mic.textContent='●';activity.textContent=e.message}finally{mic.disabled=false}}
async function confirmVoice(){const text=voiceText.value.trim();if(!text||busy)return;busy=true;voiceReview.style.display='none';addMessage('user',text);activity.textContent='正在思考…';try{const data=await request('/api/voice/transcript/confirm',{method:'POST',body:JSON.stringify({text})});addMessage('assistant',data.content);if(data.permission)permissionCard(data.permission);debug.textContent=JSON.stringify(data.activity,null,2)}catch(e){addMessage('assistant',e.message)}finally{busy=false;activity.textContent='';input.focus()}}
async function cancelVoice(){await request('/api/voice/cancel',{method:'POST'});voiceRecording=false;mic.classList.remove('recording');mic.textContent='●';voiceReview.style.display='none';voiceText.value='';activity.textContent=''}
async function speakText(text,button){try{if(speechActive){await request('/api/voice/speak/stop',{method:'POST'});speechActive=false;button.textContent='朗读'}else{await request('/api/voice/speak',{method:'POST',body:JSON.stringify({text})});speechActive=true;button.textContent='停止朗读'}}catch(e){activity.textContent=e.message}}
send.onclick=submit;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}};input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'};
mic.onclick=toggleVoice;$('#voiceConfirm').onclick=confirmVoice;$('#voiceCancel').onclick=cancelVoice;$('#voiceRetry').onclick=async()=>{await cancelVoice();await toggleVoice()};
$('#clear').onclick=async()=>{await request('/api/session',{method:'DELETE'});messages.innerHTML='<div id="empty" class="empty"><b>会话已清空。</b>重新开始吧。</div>';debug.textContent='Session cleared'};
async function restore(){try{const data=await request('/api/session');data.messages.forEach(m=>addMessage(m.role,m.content));const p=await request('/api/proactive');p.deliveries.filter(d=>d.status==='delivered').reverse().forEach(d=>showNotice(d))}catch(e){$('#connection').textContent='Core 暂时不可用'}}
async function setupDiagnostics(){try{const data=await request('/api/diagnostics');debug.textContent=JSON.stringify(data,null,2);if(data.startup&&data.startup.status!=='ready'){const model=data.startup.checks?.model||{};$('#connection').textContent='需要完成首次配置';input.placeholder='完成配置后即可和朝汐对话';addMessage('assistant',`朝汐尚未完成启动配置。${model.action||'请运行 python main.py --doctor 查看具体问题。'}`)}}catch(e){$('#connection').textContent='启动诊断不可用'}}
async function setupCapabilities(){try{const data=await request('/api/capabilities');const box=$('#capabilities');box.innerHTML='';(data.examples||[]).slice(0,4).forEach(example=>{const item=document.createElement('button');item.type='button';item.className='notice';item.style.width='100%';item.style.textAlign='left';item.textContent=example;item.onclick=()=>{input.value=example;input.focus()};box.append(item)});if(!box.children.length)box.innerHTML='<div class="sub">当前没有可展示的能力。</div>'}catch(e){$('#capabilities').innerHTML='<div class="sub">能力清单暂时不可用。</div>'}}
function showNotice(d){const n=document.createElement('div');n.className='notice';n.innerHTML=`<div class="badge">${escapeHtml(d.priority)}</div><div>${markdown(d.content)}</div><small>${escapeHtml(d.decision_reason)}</small>`;$('#notices').prepend(n);addMessage('assistant',d.content,'proactive')}
async function start(){const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';if(token){const boot=await fetch('/api/bootstrap',{method:'POST',headers:{'X-Zhaoxi-Token':token}});history.replaceState(null,'',location.pathname+location.search);if(!boot.ok)throw new Error('Desktop 会话初始化失败')}const es=new EventSource('/api/events');es.onmessage=e=>{const data=JSON.parse(e.data);if(data.type==='activity')activity.textContent=data.label||'';if(data.type==='proactive')showNotice(data.delivery)};es.onerror=()=>{$('#connection').textContent='事件通道正在重连…'};es.onopen=()=>{$('#connection').textContent='本地 Core 已连接'};await setupVoice();await restore();await setupDiagnostics();await setupCapabilities();input.focus()};start().catch(()=>{$('#connection').textContent='Desktop 会话初始化失败'});
</script>
</body>
</html>
