id: lifehud.iron_curtain.open
version: 1
name: 铁幕开幕
description: 查询 Life HUD 当前状态，并在没有活动 Focus 时开启铁幕。
aliases:
  - 朝汐，开幕
  - 开始铁幕
tags: [lifehud, focus, iron-curtain]
inputs:
  title:
    type: string
    required: true
    description: 当前铁幕的主要目标
  related_task_ids:
    type: array
    required: false
    default: []
steps:
  - id: current
    type: tool
    tool: lifehud
    arguments:
      operation: focus.current
      arguments: {}
    output_mapping:
      current: $.steps.current.output.data.focus.active
    next: has_current
  - id: has_current
    type: condition
    expression:
      exists: $.variables.current
    on_true: already_running
    on_false: start
  - id: already_running
    type: end
    result:
      outcome: already_running
      message: 当前已经有专注正在进行。
      current: $.variables.current
  - id: start
    type: tool
    tool: lifehud
    arguments:
      operation: focus.start
      arguments:
        title: $.inputs.title
        related_task_ids: $.inputs.related_task_ids
    output_mapping:
      session: $.steps.start.output.data
    next: verify
  - id: verify
    type: tool
    tool: lifehud
    arguments:
      operation: focus.current
      arguments: {}
    output_mapping:
      verified_current: $.steps.verify.output.data.focus.active
    next: verify_started
  - id: verify_started
    type: condition
    expression:
      and:
        - exists: $.variables.verified_current
        - eq: [$.variables.verified_current.id, $.variables.session.id]
        - eq: [$.variables.verified_current.mode, IRON_CURTAIN]
        - in: [$.variables.verified_current.status, [RUNNING, PAUSED]]
    on_true: opened
    on_false: verification_failed
  - id: verification_failed
    type: end
    result:
      outcome: verification_failed
      message: 操作已经提交，但暂时无法从事实源确认最终状态，请先不要重复操作。
      submitted_session: $.variables.session
      current: $.variables.verified_current
  - id: opened
    type: end
    result:
      outcome: opened
      message: 铁幕已经开幕。
      session: $.variables.verified_current
