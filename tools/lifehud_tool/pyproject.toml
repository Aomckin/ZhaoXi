[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zhaoxi-lifehud-tool"
version = "2.0.0"
description = "Independent Life HUD Tool package for Zhaoxi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "zhaoxi>=1.1.5,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "tzdata>=2025.2",
]

[project.entry-points."zhaoxi.tools"]
lifehud = "tools.lifehud_tool.package:create_package"

[tool.setuptools]
packages = ["tools.lifehud_tool"]
package-dir = {"tools.lifehud_tool" = "."}

[tool.setuptools.package-data]
"tools.lifehud_tool" = ["workflows/*.yaml"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]
