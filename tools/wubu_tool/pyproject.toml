[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zhaoxi-wubu-tool"
version = "0.2.1"
description = "Wubu local REST Tool package for Zhaoxi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["zhaoxi>=1.4.7,<2", "pydantic>=2.8,<3"]

[project.entry-points."zhaoxi.tools"]
wubu = "tools.wubu_tool.package:create_package"

[tool.setuptools]
packages = ["tools.wubu_tool"]
package-dir = {"tools.wubu_tool" = "."}

[tool.setuptools.package-data]
"tools.wubu_tool" = ["contract.json"]
