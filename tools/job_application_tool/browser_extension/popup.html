<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>朝汐浏览器桥</title>
    <style>
      body{width:320px;margin:0;padding:16px;background:#fffdf7;color:#202124;font:13px/1.55 system-ui,sans-serif}h1{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:110px 1fr;gap:6px}.value{font-weight:600;overflow-wrap:anywhere}.actions{display:flex;gap:8px;margin-top:14px}button{border:1px solid #cfc7b8;border-radius:8px;background:white;padding:7px 10px;cursor:pointer}button.primary{background:#13795b;color:white;border-color:#13795b}#error{color:#b42318;margin-top:10px;white-space:pre-wrap}
    </style>
  </head>
  <body>
    <h1>朝汐浏览器桥</h1>
    <div class="grid">
      <span>Native Host</span><span id="bridge" class="value">检查中</span>
      <span>当前页面</span><span id="page" class="value">尚未启用</span>
      <span>Page Adapter</span><span id="adapter" class="value">—</span>
      <span>Control Adapters</span><span id="controls" class="value">—</span>
      <span>Session</span><span id="session" class="value">—</span>
      <span>字段</span><span id="fields" class="value">0</span>
    </div>
    <div class="actions">
      <button id="enable" class="primary" type="button">启用并扫描</button>
      <button id="reconnect" type="button">重新连接</button>
    </div>
    <div id="error"></div>
    <script src="popup.js"></script>
  </body>
</html>
