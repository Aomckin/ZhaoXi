[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zhaoxi-markitdown-tool"
version = "0.1.0"
description = "Local MarkItDown Tool package for Zhaoxi"
requires-python = ">=3.12"
dependencies = ["zhaoxi>=1.1.5,<2", "pydantic>=2.8,<3"]

[project.entry-points."zhaoxi.tools"]
markitdown = "tools.markitdown.package:create_package"

[tool.setuptools]
packages = ["tools.markitdown"]
package-dir = {"tools.markitdown" = "."}
